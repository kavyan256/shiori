<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shiori</title>
<style>
  /* ---- tokens ------------------------------------------------------------------ */
  :root {
    --bg: #14161b; --panel: #1d2027; --raised: #252933; --line: #2c303a; --line-strong: #3a3f4b;
    --text: #ebebf0; --muted: #8b90a0; --faint: #5d6270;
    --accent: #7aa2f7; --accent-soft: rgba(122, 162, 247, .16); --ok: #9ece6a; --danger: #f7768e; --warn: #e0af68;
    --radius: 12px;
    --fast: 120ms; --base: 180ms; --slow: 260ms;
    --ease: cubic-bezier(.2, .8, .2, 1);           /* quick start, soft landing */
    --spring: cubic-bezier(.34, 1.56, .64, 1);     /* small overshoot for pops */
    --countdown: 1200ms;                           /* must match AUTO_RUN_MS */
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --raised: #eceef3; --line: #e1e4ea; --line-strong: #cfd3dc;
            --text: #1b1d22; --muted: #686d7c; --faint: #a3a7b3;
            --accent: #3567e0; --accent-soft: rgba(53, 103, 224, .12); --ok: #2f8a3a; --danger: #c93a52; --warn: #a86b00; }
  }
  /* Windows "show animations" off: keep changes instant */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important;
                             transition-duration: 1ms !important; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
               font: 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
  .wrap { padding: 12px 14px 14px; }
  .wrap.opening { animation: open var(--base) var(--ease); }
  @keyframes open { from { opacity: 0; transform: translateY(-8px) scale(.985); } }

  /* ---- header ---------------------------------------------------------------------- */
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; height: 20px; }
  .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--bg);
          font: 700 12px/20px "Segoe UI"; text-align: center; }
  .brand { font-weight: 600; letter-spacing: .01em; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; transition: color var(--base); }
  #status.live { color: var(--accent); }
  kbd { font: 11px "Segoe UI"; padding: 0 5px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); }

  /* ---- input ---------------------------------------------------------------------- */
  .ask { color: var(--accent); font-size: 13px; margin: 0 0 6px; animation: rise var(--base) var(--ease); }
  .field { position: relative; border-radius: var(--radius); }
  textarea { display: block; width: 100%; resize: none; outline: 0; border-radius: var(--radius);
             border: 1px solid var(--line); background: var(--panel); color: var(--text);
             padding: 11px 14px; height: 46px; max-height: 110px; overflow: hidden;
             font: 17px "Segoe UI Variable Display", "Segoe UI", sans-serif;
             transition: border-color var(--base), box-shadow var(--base); }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea::placeholder { color: var(--faint); }
  /* the auto-run countdown: a 2px line that fills while Shiori waits after a paste */
  .countdown { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px; overflow: hidden; }
  .countdown i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 160ms var(--ease); }
  .field.counting .countdown i { width: 100%; transition: width var(--countdown) linear; }
  /* indeterminate line while Python works */
  .field.busy .countdown i { width: 35%; animation: slide 900ms var(--ease) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 0; }
  .status-row:empty { display: none; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
          font-size: 12px; font-weight: 600; }
  .chip.pop { animation: pop 220ms var(--spring); }
  @keyframes pop { from { transform: scale(.82); opacity: 0; } }

  /* ---- views ------------------------------------------------------------------------ */
  section { margin-top: 12px; }
  section.enter { animation: rise var(--base) var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .stagger > * { animation: rise var(--base) var(--ease) backwards; animation-delay: calc(min(var(--i, 0), 12) * 18ms); }

  h2 { font: 600 16px "Segoe UI Variable Display", "Segoe UI"; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  h2 .sub { font: 400 12px "Segoe UI"; color: var(--muted); }
  .tag { font: 600 11px "Segoe UI"; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; }
  .badge { font: 600 11px "Segoe UI"; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
  .label { color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin: 12px 0 4px; }
  .msg { margin-top: 8px; font-size: 12px; color: var(--ok); animation: rise var(--base) var(--ease); }
  .warn { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .foot { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }

  .note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .note p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
  .note p:last-child { margin: 0; }
  .note .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  .step { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .box { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 4px; flex: none; position: relative;
         transition: background var(--fast), border-color var(--fast); }
  .step .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; margin: 0 4px; }
  /* next steps you can tick off: click, or say "tick 1" */
  .step.tickable { cursor: pointer; border-radius: 6px; padding: 1px 4px; margin-left: -4px; transition: color var(--base); }
  .step.tickable:hover { background: var(--accent-soft); }
  .step.tickable .num { color: var(--muted); font-size: 12px; width: 12px; }
  .step.tickable.done { color: var(--muted); }
  .step.tickable.done .text { text-decoration: line-through; }
  .step.tickable.done .box { background: var(--ok); border-color: var(--ok); animation: pop var(--base) var(--spring); }
  .step.tickable.done .box::after { content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3.5px; height: 7.5px;
                                border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  /* the note before you've said one: the one place Shiori asks for your voice */
  .note.voice { display: flex; gap: 12px; align-items: center; border: 1.5px dashed var(--accent);
                background: var(--accent-soft); padding: 12px 14px; }
  .note.voice .mic { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid;
                     place-items: center; flex: none; animation: breathe 2.4s var(--ease) infinite; }
  .note.voice .mic svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; }
  .note.voice .vtitle { font-size: 15px; font-weight: 600; }
  .note.voice .vhow { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .nlabel { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* rows */
  .scroll { max-height: 300px; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
  .row { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 9px;
         cursor: pointer; transition: background var(--fast); }
  .row:hover { background: var(--raised); }
  .row.sel { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
  .row.static { cursor: default; } .row.static:hover { background: none; }
  .row .num { color: var(--faint); width: 18px; text-align: right; font-size: 11px; flex: none; }
  .row .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                background: linear-gradient(currentColor, currentColor) no-repeat 0 55% / 0 1px;
                transition: color var(--base), background-size var(--base) var(--ease); }
  .row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  .row.off .title { color: var(--faint); background-size: 100% 1px; }   /* strike-through draws left to right */
  .row.off .avatar { opacity: .4; }
  .row.flash { animation: flash 480ms var(--ease); }
  @keyframes flash { 0%, 40% { background: var(--accent-soft); } }
  .avatar { width: 20px; height: 20px; border-radius: 6px; flex: none; font: 700 10px/20px "Segoe UI"; text-align: center;
            transition: opacity var(--base); }

  .check { width: 16px; height: 16px; border-radius: 5px; flex: none; border: 1.5px solid var(--faint);
           display: grid; place-items: center; transition: background var(--fast), border-color var(--fast); }
  .check svg { width: 10px; height: 10px; stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round;
               stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset var(--base) var(--ease); }
  .row:not(.off) .check, .gcheck.all { background: var(--accent); border-color: var(--accent); }
  .row:not(.off) .check svg, .gcheck.all svg { stroke-dashoffset: 0; }
  .gcheck.some { border-color: var(--accent); }
  .gcheck.some::after { content: ""; width: 7px; height: 2px; background: var(--accent); border-radius: 1px; }
  .row.flash .check { animation: pop 240ms var(--spring); }

  /* collapsible groups */
  .ghead { display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; color: var(--muted); font-size: 11px;
           letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  .chev { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; fill: none; transition: transform var(--base) var(--ease); }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .ghead .count { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .grows { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--base) var(--ease); }
  .grows > div { overflow: hidden; }
  .group.collapsed .grows { grid-template-rows: 0fr; }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* git cues under the note */
  .cues { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .cue { display: flex; align-items: center; gap: 8px; font: 12px "Cascadia Mono", Consolas, monospace; color: var(--muted);
         padding: 3px 10px; animation: rise var(--base) var(--ease) backwards; }
  .cue svg { width: 13px; height: 13px; stroke: var(--accent); stroke-width: 1.8; fill: none; flex: none; }
  .cue b { color: var(--text); font-weight: 600; }
  .cue .drift { color: var(--warn); margin-left: auto; font-family: "Segoe UI"; white-space: nowrap; }

  /* buttons and pills */
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font: 600 13px "Segoe UI"; border: 1px solid var(--line); background: var(--raised); color: var(--text);
           padding: 6px 14px; border-radius: 9px; cursor: pointer; transition: border-color var(--fast), transform var(--fast); }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button.danger { color: var(--danger); }
  button.danger.primary { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  /* first-run guide */
  .guide { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 12px; background: var(--panel); }
  .guide-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted);
                font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  button.ghost { background: none; border: 0; color: var(--muted); padding: 2px 6px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  button.ghost:hover { color: var(--text); }
  .guide-bar { height: 3px; border-radius: 3px; background: var(--raised); margin: 6px 0 8px; overflow: hidden; }
  .guide-bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width var(--slow) var(--ease);
                 animation: grow var(--slow) var(--ease); }
  @keyframes grow { from { width: 0; } }
  .gstep { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px;
           animation: rise var(--base) var(--ease) backwards; animation-delay: calc(var(--i) * 60ms); }
  .gstep .gtitle { flex: 1; }
  .gstep .ghow { color: var(--muted); font-size: 12px; }
  .gstep .ghow b { color: var(--text); font-weight: 600; }
  .gstep.done .check { background: var(--ok); border-color: var(--ok); }
  .gstep.done .check svg { stroke-dashoffset: 0; transition-delay: calc(var(--i) * 60ms + 120ms); }
  .gstep.done .gtitle { color: var(--muted); }
  .gstep.next { background: var(--accent-soft); }
  .gstep.next .check { border-color: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
  .gfoot { margin-top: 8px; color: var(--muted); font-size: 12px; }
  /* the guide once only one step is left: a single line, so your parks stay in view */
  .guide.compact { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .guide.compact .gtitle { flex: 1; font-size: 13px; }
  .guide.compact .gtitle b { font-weight: 600; }
  .guide.compact .gdone { color: var(--ok); font-size: 12px; white-space: nowrap; }
  /* help and "not found": every line is something you can click */
  .say-line { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 0 -10px; border-radius: 9px;
              cursor: pointer; animation: rise var(--base) var(--ease) backwards; animation-delay: calc(var(--i) * 40ms); }
  .say-line:hover { background: var(--raised); }
  .say-line .go { margin-left: auto; color: var(--muted); font-size: 12px; opacity: .45; transition: opacity var(--fast); }
  .say-line:hover .go { opacity: 1; }
  .say-line.plain { cursor: default; color: var(--muted); } .say-line.plain:hover { background: none; }
  .say-line .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  button.undo { position: relative; overflow: hidden; }
  button.undo i { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent);
                  transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  button.undo.small { padding: 1px 10px; font-size: 12px; margin-left: 6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
          background: var(--raised); font-size: 12px; }
  .spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--faint); border-top-color: var(--accent);
          animation: turn 700ms linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .pill.done .spin { display: none; }
  .pill .ok { display: none; color: var(--ok); }
  .pill.done .ok { display: inline; animation: pop 220ms var(--spring); }

  /* "Saved" tick that draws itself */
  .tick { width: 22px; height: 22px; flex: none; }
  .tick circle { fill: none; stroke: var(--ok); stroke-width: 2; }
  .tick path { fill: none; stroke: var(--ok); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 16;
               stroke-dashoffset: 16; animation: draw var(--slow) var(--ease) 80ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  details { margin-top: 8px; color: var(--muted); font-size: 12px; }
  details summary { cursor: pointer; list-style: none; }
  details summary::before { content: "▸ "; } details[open] summary::before { content: "▾ "; }
  details > div { margin: 4px 0 0 14px; }
  .empty-state { color: var(--muted); padding: 6px 2px; line-height: 1.7; }
  .empty-state b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="logo">S</div><div class="brand">Shiori</div>
    <div id="status">Hold <kbd>Ctrl</kbd><kbd>Win</kbd> to speak · or type</div>
  </header>
  <div class="ask" id="ask" hidden></div>
  <div class="field" id="field">
    <textarea id="q" spellcheck="false" rows="1"></textarea>
    <div class="countdown"><i></i></div>
  </div>
  <div class="status-row" id="chips"></div>
  <div id="view"></div>
</div>

<script>
const AUTO_RUN_MS = 1200;  // wait after Wispr pastes before running (keep in sync with --countdown)
const $ = id => document.getElementById(id);
const q = $("q"), view = $("view"), field = $("field");
let state = { view: "" }, autoRun = null, busy = false, cursor = -1;
let lastKeep = new Map();        // row index -> ticked, to animate only rows that changed
const collapsed = new Set();     // group labels you folded away
let parkNames = [], tabCycle = null;
const STATUS_IDLE = 'Hold <kbd>Ctrl</kbd><kbd>Win</kbd> to speak · or type';

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const color = s => `hsl(${hue(s)} 60% 55%)`;
const avatar = name => `<div class="avatar" style="background:hsl(${hue(name)} 60% 55% / .18);color:hsl(${hue(name)} 60% 50%)">${esc(name[0] || "?").toUpperCase()}</div>`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const CHECK = '<svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.2 2.2L9.5 3.8"/></svg>';
const CHEVRON = '<svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg>';

function setStatus(html, live = false) { $("status").innerHTML = html; $("status").classList.toggle("live", live); }

// ---- talking to Python -------------------------------------------------------
async function call(name, ...args) {
  setBusy(name === "submit" ? busyText(args[0]) : "");
  try { return await pywebview.api[name](...args); }
  finally { setBusy(""); }
}
function setBusy(text) {
  busy = !!text;
  field.classList.toggle("busy", busy);
  if (text) setStatus(text, true); else if (!autoRun) setStatus(STATUS_IDLE);
}
function busyText(text) {
  const verb = (text.match(/^\s*(?:let'?s\s+)?(\w+)/i) || [])[1]?.toLowerCase();
  return { park: "Looking at what's open…", resume: "Opening…", retrieve: "Opening…", restore: "Opening…",
           start: "Opening…", launch: "Opening…", save: "Saving…" }[verb] || "Working…";
}

// ---- the live chip: what will happen if this runs ------------------------------
function intent(text) {
  const t = text.trim().replace(/^(?:(?:ok(?:ay)?|so|please|now|let'?s|can you|could you)[\s,]+)+/i, "");
  if (!t) return "";
  if (/^(undo|undo (that|it|this)|take (that|it) back)$/i.test(t)) return "Undo";
  if (/^((hide|skip|close|dismiss)( the)? (guide|tips|getting started|tutorial)|got it)$/i.test(t)) return "Hide the guide";
  if (state.view === "ask") return `Name → ${t}`;
  if (state.view === "namecheck") return /^(yes|yeah|yep|confirm|sure|ok)/i.test(t) ? `Save as ${state.name}`
    : /^(no|nope|nah|back|go back)\b/i.test(t) ? "Back to the park" : `Name → ${t.replace(/^(save|call it|name it)( it)?( as)?\s*/i, "")}`;
  if (state.view === "confirm") return /^(yes|yeah|yep|confirm|sure|ok)/i.test(t) ? `Delete ${state.name}` : `Keep ${state.name}`;
  let m;
  if (state.view === "draft") {
    if ((m = t.match(/^(drop|remove|skip|untick|keep|add|tick)\s+(.+)/i))) return `${/^(keep|add|tick)/i.test(m[1]) ? "Keep" : "Drop"} → ${m[2]}`;
    const clearing = /(^|[\s,.]+)(and\s+)?(clear|close)(\s+(it all|everything|them|up|the desk|my desk))?$/i;
    const short = t.replace(clearing, "").trim();
    const verb = clearing.test(t) ? "Save and clear" : "Save as";
    if (!short && clearing.test(t)) return `Save and clear → ${state.name || state.suggested || "…"}`;
    if ((m = short.match(/^(?:(?:done|finished)[\s,.]+)?(?:save|name it|call it)\b(.*)/i)) || /^(done|finished|complete)$/i.test(short)) {
      const name = (m ? m[1] : "").split(/\s(?:as|called|named)\s/i).pop().replace(/^\s*(?:it|this|park)\s*/i, "").trim();
      return `${verb} → ${name || state.name || state.suggested || "…"}`;
    }
    if (/^(cancel|discard)/i.test(t)) return "Cancel this park";
    if (/^(show|list|resume|view|open|start)\b/i.test(t)) return "";
    return "Note";
  }
  if (/^(list|parks|parts|(show|see|view)(ing)?( me)?( all)? (my |the )?(parks|parts)|my (parks|parts))\b/i.test(t)) return "Show parks";
  if ((m = t.match(/^(?:park|new park)\b[\s.,:;!?]*([^.,:;!?\n]*)/i))) return `New park${m[1].trim() ? " → " + m[1].trim() : ""}`;
  if ((m = t.match(/^unpin\s+([^.,:;!?\n]+)/i))) return `Unpin → ${m[1].trim()}`;
  if ((m = t.match(/^pin\b(?:\s+(?:this|it))?\s*([^.,:;!?\n]*)/i))) return `Pin → ${m[1].trim() || state.name || "this park"}`;
  if ((m = t.match(/^(?:start|launch|set ?up|fire up)\s+([^.,:;!?\n]+)/i))) return `Start → ${m[1].trim()}`;
  if ((m = t.match(/^(?:resume|retrieve|restore|back to|continue|switch to|open)\s+([^.,:;!?\n]+)/i))) return `Resume → ${m[1].trim()}`;
  if ((m = t.match(/^(?:delete|trash|forget|remove)\s+([^.,:;!?\n]+)/i))) return `Delete → ${m[1].trim()}`;
  if ((m = t.match(/^(?:view|show|see|look at)\s+([^.,:;!?\n]+)/i))) return `View → ${m[1].trim()}`;
  return "";
}
let lastChip = "";
function updateChip() {
  const label = intent(q.value);
  if (label === lastChip) return;
  lastChip = label;
  $("chips").innerHTML = label ? `<span class="chip pop">${esc(label)}</span>` : "";
  fit();
}

// ---- pieces shared by views ---------------------------------------------------------
const MIC = '<svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg>';
// opts.voice: the draft, where the note is still to be said. opts.tickable: a saved park, where steps tick off.
function noteBlock(note, steps, emptyText = "No note", gitCues = [], opts = {}) {
  steps = steps || [];
  if (opts.voice && !note && !steps.length) return `<div class="note voice"><span class="mic">${MIC}</span><div>
      <div class="vtitle">What were you doing, and what's next?</div>
      <div class="vhow">Hold <kbd>Ctrl</kbd><kbd>Win</kbd> and say it, or type it above</div></div></div>${cueBlock(gitCues)}`;
  const done = new Set(opts.done || []);
  const label = opts.voice ? `<div class="nlabel">Your note · say a new one to replace it</div>` : "";
  const lines = note ? `<p>${esc(note)}</p>` : `<p class="empty">${esc(emptyText)}</p>`;
  const list = steps.map((s, i) => opts.tickable
    ? `<div class="step tickable ${done.has(i) ? "done" : ""}" data-step="${i}" title="Click, or say “tick ${i + 1}”">
         <span class="box"></span><span class="num">${i + 1}</span><span class="text">${esc(s)}</span></div>`
    : `<div class="step"><span class="dot"></span>${esc(s)}</div>`).join("");
  return `<div class="note">${label}${lines}${list}</div>${cueBlock(gitCues)}`;
}

// One line per git repo: branch · changes · last commit, and a warning if you've switched branch since
const BRANCH = '<svg viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="5.5" r="1.6"/><path d="M4 5.1v5.8M12 7.1c0 3-8 1.5-8 3.8"/></svg>';
function cueBlock(gitCues) {
  if (!gitCues || !gitCues.length) return "";
  return `<div class="cues">${gitCues.map((c, i) => `<div class="cue" style="animation-delay:${80 + i * 40}ms">${BRANCH}
    <span><b>${esc(c.repo)}</b> ${esc(c.text)}</span>${c.drift ? `<span class="drift">${esc(c.drift)}</span>` : ""}</div>`).join("")}</div>`;
}

// "Claude — Claude" -> "Claude"; "Chrome — Page - Google Chrome" -> "Chrome — Page": the app is said once
const APP_SUFFIX = { "VS Code": "visual studio code", "Chrome": "google chrome", "Edge": "microsoft edge" };
function rowTitle(app, title) {
  const t = title.trim();
  if (t.toLowerCase() === app.toLowerCase()) return "";
  const last = t.split(/\s[-—–]\s/).pop().toLowerCase();
  const sameApp = last !== t.toLowerCase() && (last.includes(app.toLowerCase()) || last === APP_SUFFIX[app]);
  return sameApp ? t.slice(0, t.length - last.length).replace(/\s[-—–]\s$/, "") : t;
}
function row(it, clickable) {
  const icon = it.tab ? (it.host || it.app) : it.app;
  const named = it.kind === "window" || it.kind === "file";  // apps and files say which app; tabs and terminals are grouped
  const meta = it.meta || (it.tab && it.host ? it.host.replace(/^www\./, "") : "");
  return `<div class="row ${it.keep ? "" : "off"} ${clickable ? "" : "static"}" ${clickable ? `data-toggle="${it.i}" data-nav` : ""}>
    ${clickable ? `<span class="check">${CHECK}</span>` : ""}${it.n ? `<span class="num">${it.n}</span>` : ""}
    ${avatar(icon)}<span class="title">${named ? (rowTitle(it.app, it.title) ? `${esc(it.app)} — ${esc(rowTitle(it.app, it.title))}` : esc(it.app)) : esc(it.title)}</span>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</div>`;
}

function groupsBlock(groups, clickable) {
  return groups.map(g => {
    const on = g.items.filter(i => i.keep).length;
    const mark = on === g.items.length ? "all" : on ? "some" : "";
    return `<div class="group ${collapsed.has(g.label) ? "collapsed" : ""}" data-group="${esc(g.label)}">
      <div class="ghead" data-collapse="${esc(g.label)}">${CHEVRON}
        ${clickable ? `<span class="check gcheck ${mark}" data-groupcheck="${esc(g.label)}" title="Tick or untick all">${CHECK}</span>` : ""}
        <span>${esc(g.label)}</span><span class="count">${clickable ? `${on} of ${g.items.length}` : g.items.length}</span></div>
      <div class="grows"><div>${g.items.map(it => row(it, clickable)).join("")}</div></div></div>`;
  }).join("");
}

// Undo: a button whose underline drains away over the seconds left, then the button goes
function undoButton(s, small = false) {
  if (!s.undo) return "";
  return `<button class="undo ${small ? "small" : ""}" data-say="undo" data-expires="${Date.now() + s.undo * 1000}">Undo
    <i style="animation-duration:${s.undo}s"></i></button>`;
}
setInterval(() => {
  document.querySelectorAll("[data-expires]").forEach(b => { if (Date.now() > +b.dataset.expires) { b.remove(); fit(); } });
}, 500);

function parkRow(p, i) {
  return `<div class="row" style="--i:${i}" data-say="view ${esc(p.name)}" data-nav data-name="${esc(p.name)}">
    <span class="dot" style="background:${color(p.name)}"></span>
    <span class="title"><b>${esc(p.name)}</b>${p.preset ? ` <span class="badge">preset</span>` : ""}${p.next ? ` <span class="meta">· next: ${esc(p.next)}</span>` : ""}</span>
    <span class="meta">${esc(p.ago)} · ${plural(p.items, "item")}${p.versions > 1 ? ` · ${p.versions} versions` : ""}</span></div>`;
}

// First-run guide: three steps that tick off as you do them; the next one is highlighted
const GUIDE = [
  ["hotkey", "Open Shiori from anywhere", "<kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>S</kbd>"],
  ["saved", "Save what's open", "say or type <b>park</b>, then <b>save</b>"],
  ["resumed", "Bring it back later", "<b>resume</b>: the last one, or <b>resume coding</b>"],
];
function guideCard(progress) {
  const done = GUIDE.filter(([key]) => progress[key]).length;
  const next = GUIDE.findIndex(([key]) => !progress[key]);
  if (done === GUIDE.length - 1) {
    const [, title, how] = GUIDE[next];
    return `<div class="guide compact"><span class="gdone">✓ ${done} of 3</span>
      <span class="gtitle">Last step: ${title.toLowerCase()} · ${how}</span>
      <button class="ghost" data-say="hide guide">Hide</button></div>`;
  }
  return `<div class="guide">
    <div class="guide-head"><span>Getting started · ${done} of 3</span>
      <button class="ghost" data-say="hide guide">Hide</button></div>
    <div class="guide-bar"><i style="width:${(done / 3) * 100}%"></i></div>
    ${GUIDE.map(([key, title, how], i) => `<div class="gstep ${progress[key] ? "done" : ""} ${i === next ? "next" : ""}" style="--i:${i}">
      <span class="check">${CHECK}</span><span class="gtitle">${title}</span><span class="ghow">${how}</span></div>`).join("")}
    <div class="gfoot">Typing works too, no Wispr needed. With Wispr Flow: hold <kbd>Ctrl</kbd><kbd>Win</kbd> and speak.</div>
  </div>`;
}

// ---- each view ---------------------------------------------------------------------
const views = {
  home(s) {
    const msg = s.message ? `<div class="msg">${esc(s.message)}${s.undo ? ` ${undoButton(s, true)}` : ""}</div>` : "";
    const draft = s.draft ? `<div class="foot">You have an unsaved park. Say “park” to go back to it.</div>` : "";
    const parkButton = `<div class="actions"><button class="primary" data-say="park">${s.draft ? "Back to unsaved park" : "Park what's open"}</button>
      ${s.draft ? "" : `<button class="ghost" data-say="park and clear" title="Park, then close what you saved">or park and clear</button>`}</div>`;
    const guide = s.guide ? guideCard(s.guide) : "";
    if (!s.parks.length && guide) return `<section>${msg}${guide}${parkButton}${draft}</section>`;
    if (s.parks.length && guide) return `<section>${msg}${guide}<div class="label">Your parks</div>
      <div class="scroll stagger">${s.parks.map((p, i) => parkRow(p, i)).join("")}</div>${parkButton}${draft}</section>`;
    if (!s.parks.length) return `<section>${msg}<div class="empty-state">Nothing parked yet.<br>
      Say <b>“Park”</b> to save what's open, drop what you don't need, then <b>“save as coding”</b>.<br>
      Later: <b>“resume coding”</b>.</div>${parkButton}${draft}</section>`;
    return `<section>${msg}<div class="label">Your parks · ↑↓ Enter to resume · click to view</div>
      <div class="scroll stagger">${s.parks.map((p, i) => parkRow(p, i)).join("")}</div>${parkButton}${draft}</section>`;
  },

  draft(s) {
    const total = s.groups.reduce((n, g) => n + g.items.length, 0);
    const kept = s.groups.reduce((n, g) => n + g.items.filter(i => i.keep).length, 0);
    const name = s.name || s.suggested;  // "save" alone uses the suggestion
    return `<section><h2>New park <span class="sub">→ ${esc(name)}${s.name ? "" : " (suggested)"}</span><span class="tag">not saved</span></h2>
      ${noteBlock(s.note, s.steps, "", s.cues, { voice: true })}
      <div class="scroll stagger-rows">${groupsBlock(s.groups, true)}</div>
      ${s.no_tabs.length ? `<div class="warn">${esc(s.no_tabs.join(" and "))} shows only the tab in front. Add the Shiori extension to pick tabs.</div>` : ""}
      ${s.message ? `<div class="msg">${esc(s.message)}</div>` : ""}
      <div class="actions">
        ${kept ? `<button class="primary" data-say="${s.clear ? "save and clear" : "save"}">${s.clear ? "Save and clear" : "Save"} as ${esc(name)} · ${kept} of ${total}</button>`
               : `<button class="primary" disabled>Nothing ticked · tick something to save</button>`}
        ${s.clear ? `<button data-say="save" ${kept ? "" : "disabled"}>Save, keep open</button>` : `<button data-say="save and clear" title="Save, then close what you saved" ${kept ? "" : "disabled"}>Save and clear</button>`}
        <button data-say="cancel">Cancel</button></div>
      <div class="foot">“drop 3” · say your note · “save” · “save as coding” · “save and clear” · ↑↓ Space to tick</div></section>`;
  },

  ask(s) { return ""; },

  park(s) {
    const saved = /^Saved/.test(s.message || "");
    const total = s.groups.reduce((n, g) => n + g.items.length, 0);
    const pinnedCount = s.pinned.reduce((n, g) => n + g.items.length, 0);
    const title = saved
      ? `<h2><svg class="tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>Saved ${esc(s.name)}</h2>`
      : `<h2><span class="dot" style="background:${color(s.name)}"></span>${esc(s.name)} <span class="sub">parked ${esc(s.ago)}</span>
         ${pinnedCount ? `<span class="badge">preset</span>` : ""}</h2>`;
    const message = s.message && !saved ? `<div class="msg" style="margin:-2px 0 8px">${esc(s.message)}</div>` : "";
    // after saving, the long list folds into one line per group; the full list is a click away
    const items = saved
      ? `<div class="pills stagger" style="margin-top:10px">${s.groups.map((g, i) => `<span class="pill" style="--i:${i}">${esc(g.label)} · ${g.items.length}</span>`).join("")}</div>
         <details><summary>Show the ${plural(total, "saved item")}${esc((s.message.match(/· version \d+/) || [""])[0].replace("·", " ·"))}</summary>${groupsBlock(s.groups, false)}</details>`
      : `<div class="scroll">${groupsBlock(s.groups, false)}</div>`;
    const pinned = pinnedCount ? `<details><summary>Preset: ${plural(pinnedCount, "pinned item")} open on “start ${esc(s.name)}”</summary>
      ${groupsBlock(s.pinned, false)}</details>` : "";
    const versions = s.versions.length ? `<details><summary>${plural(s.versions.length, "older version")}</summary>${
      s.versions.map(v => `<div>${esc(v.ago)} — ${esc(v.note || "no note")}</div>`).join("")}</details>` : "";
    const buttons = pinnedCount
      ? `<button class="primary" data-say="start ${esc(s.name)}">Start preset</button><button data-say="resume ${esc(s.name)}">Resume last park</button>`
      : `<button class="primary" data-say="resume ${esc(s.name)}">Resume</button><button data-say="pin ${esc(s.name)}">Pin as preset</button>`;
    // after "save and clear": what closed, and what was left open on purpose (and why)
    const cleared = s.cleared ? `<div class="msg">${s.cleared.length ? `Cleared ${esc(s.cleared.join(", "))}` : "Nothing needed closing"}</div>
      ${s.left_open?.length ? `<details><summary>${plural(s.left_open.length, "thing")} left open</summary>${
        s.left_open.map(x => `<div>${esc(x)}</div>`).join("")}</details>` : ""}` : "";
    return `<section>${title}${message}${noteBlock(s.note, s.steps, "No note", s.cues, { tickable: true, done: s.done })}${items}${cleared}${pinned}${versions}
      <div class="actions">${undoButton(s)}${buttons}<button data-say="list">All parks</button>
      <button class="danger" data-say="delete ${esc(s.name)}">Delete</button></div></section>`;
  },

  resume(s) {
    const started = s.verb === "Started";
    const pills = s.opened.map((o, i) => `<span class="pill" data-open="${i}"><span class="spin"></span><span class="ok">✓</span>${esc(o.replace(/\s+/g, " "))}</span>`).join("");
    // "already open" isn't a failure: count it apart from things that really couldn't come back
    const already = s.skipped.filter(x => x.endsWith("(already open)")).length;
    const missed = s.skipped.length - already;
    const summary = [already && `${already} already open`, missed && `${missed} not reopened`].filter(Boolean).join(" · ");
    const skipped = s.skipped.length ? `<details><summary>${summary}</summary>${
      s.skipped.map(x => `<div>${esc(x)}</div>`).join("")}</details>` : "";
    const verb = { Started: "Started", Reopened: "Reopened" }[s.verb] || "Resuming";
    return `<section><h2>${verb} ${esc(s.name)} <span class="sub">${started ? "last parked" : "parked"} ${esc(s.ago)}</span></h2>
      ${noteBlock(s.note, s.steps, "No note", s.cues, { tickable: true, done: s.done })}
      <div class="label">${s.opened.length ? "Opening" : "Nothing to open"}</div>
      <div class="pills stagger">${pills || `<span class="meta">It's all already here.</span>`}</div>${skipped}
      ${s.undo ? `<div class="actions">${undoButton(s)}</div>` : ""}</section>`;
  },

  namecheck(s) {
    return `<section><h2>Save as “${esc(s.name)}”?</h2>
      <div class="foot" style="margin-top:2px">That's a long name, maybe part of your note. Say a shorter name, or pick one:</div>
      <div class="actions">${s.suggested ? `<button class="primary" data-say="${esc(s.suggested)}">Save as ${esc(s.suggested)}</button>` : ""}
        <button data-say="yes">Keep the long name</button><button data-say="back">Back</button></div></section>`;
  },

  confirm(s) {
    return `<section><h2>${esc(s.title)}</h2>${s.lines.map(l => `<div class="foot" style="margin-top:2px">${esc(l)}</div>`).join("")}
      <div class="actions"><button class="danger primary" data-say="yes">Delete</button><button data-say="keep">Keep it</button></div></section>`;
  },

  message(s) {
    const line = (l, i) => typeof l === "string"
      ? (s.lines.some(x => typeof x !== "string") ? `<div class="say-line plain" style="--i:${i}">${esc(l)}</div>`
                                                  : `<div class="step" style="--i:${i}">· ${esc(l)}</div>`)
      : `<div class="say-line" data-say="${esc(l.say)}" style="--i:${i}">${l.park ? `<span class="pdot"></span>` : ""}${esc(l.text)}<span class="go">↵</span></div>`;
    return `<section><h2>${esc(s.title)}</h2><div class="stagger">${s.lines.map(line).join("")}</div></section>`;
  },
};

const PLACEHOLDER = {
  home: "park · show my parks · resume coding · start dsa",
  draft: "drop 3 · your note · save as coding",
  ask: "coding, acads, dsa…",
  park: "resume · pin this · start · delete",
  confirm: "yes / no",
  namecheck: "a shorter name · yes · back",
};

// ---- drawing ------------------------------------------------------------------------
function render(s, { fresh = false } = {}) {
  const changedView = fresh || s.view !== state.view;
  state = s;
  $("ask").hidden = s.view !== "ask";
  $("ask").textContent = s.view === "ask" ? s.prompt : "";
  q.placeholder = s.view === "ask" && s.suggested ? `${s.suggested} (Enter to use)` : PLACEHOLDER[s.view] || PLACEHOLDER.home;
  view.innerHTML = views[s.view](s);
  if (s.view === "resume") holdUntil = Date.now() + 5000;

  const section = view.querySelector("section");
  if (section && changedView) section.classList.add("enter");
  // rows: stagger in when a view first appears; afterwards only flash the rows that changed
  const rows = [...view.querySelectorAll("[data-toggle]")];
  const keep = new Map(rows.map(r => [+r.dataset.toggle, !r.classList.contains("off")]));
  rows.forEach((r, n) => {
    const i = +r.dataset.toggle;
    if (changedView) { r.style.setProperty("--i", n); r.style.animation = `rise var(--base) var(--ease) backwards ${Math.min(n, 12) * 18}ms`; }
    else if (lastKeep.has(i) && lastKeep.get(i) !== keep.get(i)) r.classList.add("flash");
  });
  lastKeep = keep;
  if (s.view === "resume") playOpening();
  if (s.parks) parkNames = s.parks.map(p => p.name);
  cursor = changedView ? (s.view === "home" ? 0 : -1) : cursor;
  showCursor(false);
  updateChip();
  fit();
}

// Resume: each pill shows a spinner, then a tick, one after another
function playOpening() {
  view.querySelectorAll("[data-open]").forEach((p, i) => setTimeout(() => p.classList.add("done"), 300 + i * 200));
}

// Ask Python to resize the window to what's drawn (after layout settles)
function fit() {
  requestAnimationFrame(() => pywebview.api.resize(Math.ceil($("wrap").getBoundingClientRect().height)));
}

// ---- keyboard: ↑↓ to move, Space to tick, Enter to resume, Tab to complete --------------
function navRows() { return [...view.querySelectorAll("[data-nav]")].filter(r => !r.closest(".collapsed")); }
function showCursor(scroll = true) {
  navRows().forEach((r, i) => r.classList.toggle("sel", i === cursor));
  const current = navRows()[cursor];
  if (scroll && current) current.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function complete() {
  const m = q.value.match(/^(\s*(?:resume|view|start|delete|pin|unpin|park|show|open|save as)\s+)(.*)$/i);
  if (!m || !parkNames.length) return false;
  if (!tabCycle || tabCycle.prefix !== m[1]) {
    const typed = m[2].toLowerCase();
    const options = parkNames.filter(n => n.toLowerCase().startsWith(typed))
      .concat(parkNames.filter(n => !n.toLowerCase().startsWith(typed) && n.toLowerCase().includes(typed)));
    if (!options.length) return false;
    tabCycle = { prefix: m[1], options, at: -1 };
  }
  tabCycle.at = (tabCycle.at + 1) % tabCycle.options.length;
  q.value = tabCycle.prefix + tabCycle.options[tabCycle.at];
  updateChip();
  return true;
}

// ---- input ---------------------------------------------------------------------------
function startCountdown() {
  clearTimeout(autoRun);
  field.classList.remove("counting");
  void field.offsetWidth;  // restart the line's transition
  field.classList.add("counting");
  setStatus("Running in a moment · any key to stop", true);
  autoRun = setTimeout(submit, AUTO_RUN_MS);
}
function stopCountdown() {
  if (!autoRun) return;
  clearTimeout(autoRun);
  autoRun = null;
  field.classList.remove("counting");
  setStatus(STATUS_IDLE);
}

async function submit(text = q.value) {
  stopCountdown();
  field.classList.remove("counting");
  if (busy) return;
  q.value = "";
  sizeInput();
  updateChip();
  render(await call("submit", text));
}

function sizeInput() { q.style.height = "46px"; q.style.height = Math.min(q.scrollHeight + 2, 110) + "px"; }

q.addEventListener("input", () => { tabCycle = null; updateChip(); sizeInput(); fit(); });
q.addEventListener("paste", () => {
  // Wispr pastes your words: pulse once, then run after a short, visible countdown
  field.animate([{ boxShadow: "0 0 0 0 transparent" }, { boxShadow: "0 0 0 4px var(--accent-soft)" }, { boxShadow: "0 0 0 0 transparent" }],
                { duration: 420, easing: "ease-out" });
  requestAnimationFrame(startCountdown);
});
q.addEventListener("keydown", e => {
  const isPaste = e.ctrlKey && e.key.toLowerCase() === "v";
  if (!["Control", "Enter", "Tab"].includes(e.key) && !isPaste) stopCountdown();
  if (e.key === "Escape") { e.preventDefault(); pywebview.api.hide(); return; }
  if (e.key === "Tab") { e.preventDefault(); complete(); return; }  // Tab never leaves the box
  const empty = !q.value.trim();
  if (empty && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const n = navRows().length;
    if (!n) return;
    const step = e.key === "ArrowDown" ? 1 : -1;
    cursor = cursor < 0 ? (step > 0 ? 0 : n - 1) : (cursor + step + n) % n;
    showCursor();
    return;
  }
  if (empty && e.key === " " && state.view === "draft" && cursor >= 0) {
    e.preventDefault();
    const target = navRows()[cursor];
    if (target) toggleRow(+target.dataset.toggle);
    return;
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (empty && state.view === "home" && cursor >= 0 && navRows()[cursor]) return submit("resume " + navRows()[cursor].dataset.name);
    submit();
  }
});

async function toggleRow(i) { render(await call("toggle", i)); }

view.addEventListener("click", async e => {
  const groupCheck = e.target.closest("[data-groupcheck]");
  if (groupCheck) {
    e.stopPropagation();
    const group = state.groups.find(g => g.label === groupCheck.dataset.groupcheck);
    const allOn = group.items.every(i => i.keep);
    render(await call("set_many", group.items.map(i => i.i), !allOn));
    return q.focus();
  }
  const fold = e.target.closest("[data-collapse]");
  if (fold) {
    const label = fold.dataset.collapse;
    collapsed.has(label) ? collapsed.delete(label) : collapsed.add(label);
    fold.closest(".group").classList.toggle("collapsed", collapsed.has(label));
    setTimeout(fit, 200);  // after the fold animation
    return q.focus();
  }
  const step = e.target.closest("[data-step]");
  if (step) {
    const done = await call("tick_step", state.name, +step.dataset.step);
    if (Array.isArray(done)) {
      state.done = done;
      view.querySelectorAll("[data-step]").forEach(el => el.classList.toggle("done", done.includes(+el.dataset.step)));
    }
    return q.focus();
  }
  const target = e.target.closest("[data-toggle], [data-say]");
  if (!target) return;
  if (target.dataset.toggle !== undefined) await toggleRow(+target.dataset.toggle);
  else submit(target.dataset.say);
  q.focus();
});

// ---- click somewhere else and the bar gets out of the way -----------------------------------
// Not while a pasted command is counting down or running, and not in the first seconds after
// a resume: the windows it opens take focus, and you should still get to read your note.
// Those only delay it: once they're over, if you're still elsewhere, the bar goes.
let holdUntil = 0;
function hideIfLeft() {
  if (document.hasFocus()) return;
  if (autoRun || busy || Date.now() < holdUntil) return setTimeout(hideIfLeft, 300);
  pywebview.api.blurred();
}
window.addEventListener("blur", () => setTimeout(hideIfLeft, 0));

// ---- called from Python ------------------------------------------------------------------
window.Shiori = {
  show(v) { if (!busy) render(v); },  // Python pushing an update (e.g. tabs arrived)
  open() {
    stopCountdown();
    q.value = "";
    sizeInput();
    lastChip = "";
    $("chips").innerHTML = "";
    $("wrap").classList.remove("opening");
    void $("wrap").offsetWidth;  // replay the opening animation every time
    $("wrap").classList.add("opening");
    q.focus();
    pywebview.api.opened().then(v => render(v, { fresh: true }));  // don't wait: focus first
    pywebview.api.names().then(n => { if (Array.isArray(n)) parkNames = n; });
    return document.activeElement === q;
  },
};
</script>
