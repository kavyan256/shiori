<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shiori note</title>
<style>
  /* The moment after a resume: your desk, dimmed, and your own note on top in big type.
     The "dim" is a screenshot of the screen behind, darkened, so no see-through window is needed. */
  :root { --text: #f4f5f8; --muted: #a9aebb; --accent: #8fb0ff; --ok: #9ece6a;
          --ease: cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; color: var(--text);
               font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; cursor: default; user-select: none; }

  .backdrop { position: fixed; inset: -20px; background: #0b0c10 center / cover no-repeat;
              filter: brightness(.32) blur(3px) saturate(.8); animation: dim 450ms var(--ease) both; }
  .shade { position: fixed; inset: 0;
           background: linear-gradient(115deg, rgba(8, 9, 13, .92) 0%, rgba(8, 9, 13, .55) 45%, rgba(8, 9, 13, .25) 100%); }
  @keyframes dim { from { filter: brightness(1) blur(0) saturate(1); } }

  main { position: fixed; top: 9vh; left: 7vw; width: min(58vw, 980px); }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 18px; letter-spacing: .02em;
             animation: rise 500ms 150ms var(--ease) both; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #0b0c10;
          display: grid; place-items: center; font: 700 17px "Segoe UI"; }
  .eyebrow b { color: var(--text); font-weight: 600; }
  h1 { font-size: clamp(38px, 3.6vw, 68px); line-height: 1.12; font-weight: 700; letter-spacing: -.015em;
       margin: 22px 0 30px; text-wrap: balance; animation: rise 600ms 260ms var(--ease) both; }
  h1.none { color: var(--muted); font-weight: 600; }
  .label { color: var(--muted); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px;
           animation: rise 500ms 420ms var(--ease) both; }
  .steps { display: grid; gap: 12px; }
  .step { display: flex; align-items: center; gap: 16px; font-size: clamp(22px, 1.7vw, 32px); font-weight: 600;
          animation: rise 500ms var(--ease) both; animation-delay: calc(480ms + var(--i) * 90ms); }
  .step .box { width: 26px; height: 26px; border: 2.5px solid var(--muted); border-radius: 7px; flex: none; position: relative; }
  .step.done { color: var(--muted); } .step.done .text { text-decoration: line-through; }
  .step.done .box { background: var(--ok); border-color: var(--ok); }
  .step.done .box::after { content: ""; position: absolute; left: 7px; top: 2px; width: 7px; height: 13px;
                           border: solid #0b0c10; border-width: 0 3px 3px 0; transform: rotate(45deg); }
  .cue { margin-top: 30px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 12px;
         background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); color: var(--muted);
         font: 16px "Cascadia Code", Consolas, monospace; animation: rise 500ms 700ms var(--ease) both; }
  .cue b { color: var(--text); }
  .cue .drift { color: #f0b46a; }
  .cue svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.6; }

  /* the desk as it was when you saved: bottom right */
  figure { position: fixed; right: 5vw; bottom: 8vh; margin: 0; width: min(32vw, 560px);
           animation: float-in 700ms 380ms var(--ease) both; }
  figure img { width: 100%; display: block; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .16);
               box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
  figcaption { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
  @keyframes float-in { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .hint { position: fixed; left: 7vw; bottom: 6vh; color: var(--muted); font-size: 16px;
          animation: rise 500ms 1100ms var(--ease) both; }
  kbd { font: 600 13px "Segoe UI"; padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .2);
        background: rgba(255, 255, 255, .06); }
  body.leaving { transition: opacity 260ms var(--ease); opacity: 0; }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div><div class="shade"></div>
<main id="main" role="dialog" aria-label="Your note for this desk" aria-live="assertive"></main>
<figure id="shot" hidden><figcaption>Your desk when you saved it</figcaption><img id="shotimg" alt="A picture of your screen when you saved this desk"></figure>
<div class="hint">Click anywhere or press any key to get to work</div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BRANCH = '<svg viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="5.5" r="1.6"/><path d="M4 5.1v5.8M12 7.1c0 3-8 1.5-8 3.8"/></svg>';

// Called from Python with what to show: {name, ago, note, steps, done, cues, backdrop, shot}
window.ShioriNote = {
  show(s) {
    document.body.classList.remove("leaving");
    const done = new Set(s.done || []);
    const steps = (s.steps || []).map((t, i) =>
      `<div class="step ${done.has(i) ? "done" : ""}" style="--i:${i}"><span class="box"></span><span class="text">${esc(t)}</span></div>`).join("");
    const cues = (s.cues || []).map(c => `<div class="cue">${BRANCH}<span><b>${esc(c.repo)}</b> ${esc(c.text)}</span>${
      c.drift ? `<span class="drift">${esc(c.drift)}</span>` : ""}</div>`).join("<br>");
    document.getElementById("main").innerHTML = `
      <div class="eyebrow"><span class="logo">S</span><span>Back to <b>${esc(s.name)}</b> · saved ${esc(s.ago)}</span></div>
      ${s.note ? `<h1>${esc(s.note)}</h1>` : `<h1 class="none">No note this time. Everything's open where you left it.</h1>`}
      ${steps ? `<div class="label">Next</div><div class="steps">${steps}</div>` : ""}
      ${cues}`;
    document.getElementById("backdrop").style.backgroundImage = s.backdrop ? `url("${s.backdrop}")` : "none";
    const shot = document.getElementById("shot");
    shot.hidden = !s.shot;
    if (s.shot) document.getElementById("shotimg").src = s.shot;
    // replay the entrance animations each time
    document.querySelectorAll("main, figure, .backdrop, .hint").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  },
};

let leaving = false;
function leave() {
  if (leaving) return;
  leaving = true;
  document.body.classList.add("leaving");
  setTimeout(() => { leaving = false; window.pywebview && pywebview.api.dismiss(); }, 260);
}
addEventListener("keydown", leave);
addEventListener("mousedown", leave);
</script>
</body>
</html>
